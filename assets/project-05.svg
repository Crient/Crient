 </defs><style>
text{font-family:-apple-system, BlinkMacSystemFont, 'DejaVu Sans', 'Segoe UI', Arial, sans-serif} .mono{font-family:'DejaVu Sans Mono', Menlo, Consolas, monospace}
@media (prefers-reduced-motion:no-preference){
.float{animation:float 3.1s ease-in-out infinite; transform-box:fill-box; transform-origin:center}
.glow{animation:pulse 2.8s ease-in-out infinite}
.spark{animation:blink 2.3s ease-in-out infinite alternate}
.dash{animation:dash 3s linear infinite}
}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes pulse{0%,100%{opacity:.65}50%{opacity:1}}
