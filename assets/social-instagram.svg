<svg xmlns="http://www.w3.org/2000/svg" width="586" height="150" viewBox="0 0 586 150" role="img" aria-label="INSTAGRAM. Design, daily life, and more.">
 <defs>
 <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M18 0H0V18" fill="none" stroke="#4a99a5" stroke-width=".7" opacity=".18"/></pattern>
 <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0e3040"/><stop offset="1" stop-color="#071722"/></linearGradient>
 <linearGradient id="globe" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9ef6b5"/><stop offset=".5" stop-color="#2eb6a9"/><stop offset="1" stop-color="#144b63"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ffe17b"/><stop offset=".65" stop-color="#ffca63"/><stop offset="1" stop-color="#ffa963"/></linearGradient>
 <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b3dfff"/><stop offset=".5" stop-color="#6099e6"/><stop offset="1" stop-color="#23517b"/></linearGradient>
 <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffd0df"/><stop offset="1" stop-color="#d66d9d"/></linearGradient>
 <filter id="glowFilter" x="-30%" y="-40%" width="160%" height="180%"><feGaussianBlur stdDeviation="5"/></filter>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity=".5"/></filter>
 </defs><style>
text{font-family:-apple-system, BlinkMacSystemFont, 'DejaVu Sans', 'Segoe UI', Arial, sans-serif} .mono{font-family:'DejaVu Sans Mono', Menlo, Consolas, monospace}
@media (prefers-reduced-motion:no-preference){
.float{animation:float 3.1s ease-in-out infinite; transform-box:fill-box; transform-origin:center}
.glow{animation:pulse 2.8s ease-in-out infinite}
.spark{animation:blink 2.3s ease-in-out infinite alternate}
.dash{animation:dash 3s linear infinite}
}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes pulse{0%,100%{opacity:.65}50%{opacity:1}}
@keyframes blink{from{opacity:.22}to{opacity:1}}
@keyframes dash{to{stroke-dashoffset:-40}}
</style>
 <rect x="0" y="0" width="586" height="150" rx="0" fill="#07111B"/><rect x="5" y="5" width="576" height="140" rx="9" fill="url(#panel)" stroke="#f59bc6" stroke-width="2"/><rect x="12" y="11" width="562" height="128" rx="0" fill="url(#grid)"/><rect x="7" y="7" width="5" height="136" rx="0" fill="#f59bc6"/><rect x="13" y="7" width="560" height="3" rx="0" fill="#f59bc6"/><text x="30" y="39" font-size="16" font-weight="750" fill="#a5d2d5" class="mono" letter-spacing="1">VISUALS + LIFE</text><text x="28" y="88" font-size="33" font-weight="950" fill="#f3fff9" >INSTAGRAM</text><text x="30" y="119" font-size="19" font-weight="620" fill="#a4dbe0" >Design, daily life, and more.</text><g transform="translate(440 29)"><rect x="4" y="4" width="92" height="92" rx="27" fill="none" stroke="#fa79b9" stroke-width="9"/><circle cx="50" cy="50" r="23" stroke="#ff9ac3" stroke-width="8" fill="none"/><circle cx="76" cy="23" r="7" fill="#ffd067"/><path d="M6 75q-5 18 17 20" fill="none" stroke="#ffd063" stroke-width="8"/></g><path d="M540 31l28-25m-20 0h20v20" stroke="#a7dae0" stroke-width="3" fill="none"/>
 </svg>