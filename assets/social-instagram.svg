<svg xmlns="http://www.w3.org/2000/svg" width="760" height="180" viewBox="0 0 760 180" role="img" aria-label="INSTAGRAM social card">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a1822"/>
      <stop offset="100%" stop-color="#0a2730"/>
    </linearGradient>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0H0V22" fill="none" stroke="#7bd4d8" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-30%" width="140%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#ff88cb" flood-opacity="0.9"/>
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#ff88cb" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#ff88cb" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect x="5" y="5" width="750" height="170" rx="14" fill="#061118" stroke="#ff88cb" stroke-opacity="0.65" stroke-width="2"/>
  <rect x="9" y="9" width="742" height="162" rx="12" fill="url(#bg)" stroke="#ff88cb" stroke-width="3" filter="url(#glow)"/>
  <rect x="9" y="9" width="742" height="162" rx="12" fill="url(#grid)"/>

  <text x="34" y="53" fill="#a8c7d3" font-family="Courier New, monospace" font-size="18" font-weight="700" letter-spacing="1.6">VISUALS + LIFE</text>
  <text x="34" y="104" fill="#eef8fb" font-family="Arial Black, Arial, sans-serif" font-size="36" font-weight="900">INSTAGRAM</text>
  <text x="34" y="144" fill="#cbe4ea" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Design, daily life, and more.</text>

  <path d="M698 24H726V52" fill="none" stroke="#cdeeff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <path d="M690 60L726 24" fill="none" stroke="#cdeeff" stroke-width="5" stroke-linecap="round" opacity="0.9"/>

  
  <g filter="url(#glow)" transform="translate(565 35)">
    <rect x="0" y="0" width="116" height="116" rx="30" fill="none" stroke="#f878c1" stroke-width="10"/>
    <circle cx="58" cy="58" r="27" fill="none" stroke="#f878c1" stroke-width="10"/>
    <circle cx="91" cy="25" r="9" fill="#f5c054"/>
    <path d="M0 88 Q0 116 28 116" fill="none" stroke="#ffd45b" stroke-width="10" stroke-linecap="round"/>
  </g>
</svg>