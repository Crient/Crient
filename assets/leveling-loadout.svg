ize="17" font-weight="620" fill="#f3fff9" >Pandas / NumPy / Scikit-learn / ML / Agents</text><text x="638" y="196" font-size="18" font-weight="850" fill="#ff846c" >DESIGN</text><text x="766" y="196" font-size="17" font-weight="620" fill="#f3fff9" >Figma / UX / Prototyping / Motion / Video</text>
 </svg>