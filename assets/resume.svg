<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="118" viewBox="0 0 1600 118" role="img" aria-label="Resume get the details call to action">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#091823"/>
      <stop offset="100%" stop-color="#0a2232"/>
    </linearGradient>
    <linearGradient id="blueStroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#69b7ff"/>
      <stop offset="100%" stop-color="#8fd7ff"/>
    </linearGradient>
    <pattern id="grid2" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#6cbcc0" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="blueGlow" x="-20%" y="-50%" width="140%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#7ec4ff" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#68b8ff" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#50afff" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect x="7" y="7" width="1586" height="104" rx="12" fill="#061118" stroke="#25496b" stroke-width="2"/>
  <rect x="14" y="14" width="1572" height="90" rx="10" fill="url(#bg2)" stroke="url(#blueStroke)" stroke-width="4" filter="url(#blueGlow)"/>
  <rect x="14" y="14" width="1572" height="90" rx="10" fill="url(#grid2)"/>

  <g transform="translate(44 31)" filter="url(#blueGlow)">
    <rect x="0" y="0" width="54" height="54" rx="6" fill="none" stroke="#9dccff" stroke-width="5"/>
    <path d="M15 18H39M15 28H39M15 38H33" stroke="#9dccff" stroke-width="5" stroke-linecap="round"/>
  </g>

  <text x="128" y="55" fill="#f4fbff" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="40" font-weight="900">RESUME / GET THE DETAILS</text>
  <text x="128" y="86" fill="#b1dcff" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Experience, projects, and more about me.</text>

  <!-- Secondary CTA: end-anchored text leaves a dedicated 72px zone for the icon. -->
  <text x="1430" y="68" text-anchor="end" fill="#a9d5ff" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="800" letter-spacing="0.7">OPEN DOCUMENT</text>
  <!-- Smaller north-east external-link arrow; intentionally separate from the text. -->
  <g filter="url(#blueGlow)">
    <path d="M1493 78L1537 34 M1509 34H1537V62" fill="none" stroke="#a8d4ff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
