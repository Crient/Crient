<svg xmlns="http://www.w3.org/2000/svg" width="760" height="180" viewBox="0 0 760 180" role="img" aria-label="EMAIL social card">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a1822"/>
      <stop offset="100%" stop-color="#0a2730"/>
    </linearGradient>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0H0V22" fill="none" stroke="#7bd4d8" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-30%" width="140%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#46f4ee" flood-opacity="0.9"/>
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#46f4ee" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#46f4ee" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect x="5" y="5" width="750" height="170" rx="14" fill="#061118" stroke="#46f4ee" stroke-opacity="0.65" stroke-width="2"/>
  <rect x="9" y="9" width="742" height="162" rx="12" fill="url(#bg)" stroke="#46f4ee" stroke-width="3" filter="url(#glow)"/>
  <rect x="9" y="9" width="742" height="162" rx="12" fill="url(#grid)"/>

  <text x="34" y="53" fill="#a8c7d3" font-family="Courier New, monospace" font-size="18" font-weight="700" letter-spacing="1.6">LET’S TALK</text>
  <text x="34" y="104" fill="#eef8fb" font-family="Arial Black, Arial, sans-serif" font-size="36" font-weight="900">EMAIL</text>
  <text x="34" y="144" fill="#cbe4ea" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Say hi anytime.</text>

  <path d="M698 24H726V52" fill="none" stroke="#cdeeff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <path d="M690 60L726 24" fill="none" stroke="#cdeeff" stroke-width="5" stroke-linecap="round" opacity="0.9"/>

  
  <g filter="url(#glow)" transform="translate(561 39)">
    <rect x="0" y="0" width="122" height="82" rx="12" fill="none" stroke="#adffde" stroke-width="8"/>
    <path d="M10 12L61 54L112 12" fill="none" stroke="#adffde" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>