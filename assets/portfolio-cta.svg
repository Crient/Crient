<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="180" viewBox="0 0 1600 180" role="img" aria-label="Open my portfolio call to action">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#08161d"/>
      <stop offset="60%" stop-color="#0a2430"/>
      <stop offset="100%" stop-color="#0b2d39"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f7c552"/>
      <stop offset="50%" stop-color="#ffe07a"/>
      <stop offset="100%" stop-color="#efb948"/>
    </linearGradient>
    <linearGradient id="goldStroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f3c04e"/>
      <stop offset="100%" stop-color="#ffe391"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#72d2d6" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="outerGlow" x="-20%" y="-50%" width="140%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#ffdd77" flood-opacity="0.85"/>
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#ffcc4d" flood-opacity="0.55"/>
      <feDropShadow dx="0" dy="0" stdDeviation="22" flood-color="#ffb833" flood-opacity="0.28"/>
    </filter>
    <filter id="innerTextGlow" x="-30%" y="-50%" width="160%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#ffe37f" flood-opacity="0.45"/>
    </filter>
    <filter id="portalGlow" x="-40%" y="-70%" width="180%" height="240%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#5ec9ff" flood-opacity="0.55"/>
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#ffe37f" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect x="7" y="7" width="1586" height="166" rx="15" fill="#061118" stroke="#554721" stroke-width="2"/>
  <rect x="14" y="14" width="1572" height="152" rx="13" fill="url(#bg)" stroke="url(#goldStroke)" stroke-width="4" filter="url(#outerGlow)"/>
  <rect x="14" y="14" width="1572" height="152" rx="13" fill="url(#grid)"/>
  <rect x="28" y="28" width="1544" height="124" rx="10" fill="none" stroke="#edb860" stroke-opacity="0.92" stroke-width="2.5"/>

  <text x="66" y="61" fill="#ffd45c" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="4">YOUR SHORTCUT  //</text>
  <text x="66" y="118" fill="url(#gold)" filter="url(#innerTextGlow)" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="72" font-weight="900">OPEN MY PORTFOLIO</text>
  <text x="66" y="150" fill="#82e0e3" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="2">PROJECTS  /  DESIGN  /  EXPERIMENTS  /  AND MORE</text>

  <path d="M1174 144H1520" stroke="#ffd45c" stroke-opacity="0.12" stroke-width="2"/>
  <path d="M1138 141L1216 90L1288 141Z" fill="#27b1aa" opacity="0.95"/>
  <path d="M1220 154L1315 72L1410 154Z" fill="#214d8c" opacity="0.98"/>
  <path d="M1342 154L1445 90L1540 154Z" fill="#1c6f70" opacity="0.98"/>

  <g filter="url(#portalGlow)">
    <rect x="1310" y="48" width="76" height="92" rx="5" fill="#f4d06f"/>
    <path d="M1322 62L1348 39L1374 62V130H1322Z" fill="#eac15e"/>
    <rect x="1331" y="58" width="45" height="68" rx="2" fill="#1d3f8e"/>
    <circle cx="1343" cy="78" r="2.8" fill="#ffefb8"/>
    <circle cx="1361" cy="91" r="3.2" fill="#ffefb8"/>
    <circle cx="1356" cy="68" r="2" fill="#ffefb8"/>
    <path d="M1353 122L1334 152H1374Z" fill="#71bbff" opacity="0.95"/>
  </g>

  <g filter="url(#outerGlow)">
    <circle cx="1506" cy="90" r="36" fill="none" stroke="#ffd45c" stroke-width="5"/>
    <path d="M1492 90H1516" stroke="#ffd45c" stroke-width="7" stroke-linecap="round"/>
    <path d="M1503 78L1516 90L1503 102" fill="none" stroke="#ffd45c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
