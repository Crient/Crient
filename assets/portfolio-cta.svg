<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="155" viewBox="0 0 1200 155" role="img" aria-label="OPEN MY PORTFOLIO. Projects, design, experiments, and more.">
 <defs>
 <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M18 0H0V18" fill="none" stroke="#4a99a5" stroke-width=".7" opacity=".18"/></pattern>
 <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0e3040"/><stop offset="1" stop-color="#071722"/></linearGradient>
 <linearGradient id="globe" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9ef6b5"/><stop offset=".5" stop-color="#2eb6a9"/><stop offset="1" stop-color="#144b63"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ffe17b"/><stop offset=".65" stop-color="#ffca63"/><stop offset="1" stop-color="#ffa963"/></linearGradient>
 <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b3dfff"/><stop offset=".5" stop-color="#6099e6"/><stop offset="1" stop-color="#23517b"/></linearGradient>
 <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffd0df"/><stop offset="1" stop-color="#d66d9d"/></linearGradient>
 <filter id="glowFilter" x="-30%" y="-40%" width="160%" height="180%"><feGaussianBlur stdDeviation="5"/></filter>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity=".5"/></filter>
 </defs><style>
text{font-family:-apple-system, BlinkMacSystemFont, 'DejaVu Sans', 'Segoe UI', Arial, sans-serif} .mono{font-family:'DejaVu Sans Mono', Menlo, Consolas, monospace}
@media (prefers-reduced-motion:no-preference){
.float{animation:float 3.1s ease-in-out infinite; transform-box:fill-box; transform-origin:center}
.glow{animation:pulse 2.8s ease-in-out infinite}
.spark{animation:blink 2.3s ease-in-out infinite alternate}
.dash{animation:dash 3s linear infinite}
}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes pulse{0%,100%{opacity:.65}50%{opacity:1}}
@keyframes blink{from{opacity:.22}to{opacity:1}}
@keyframes dash{to{stroke-dashoffset:-40}}
</style>
 <rect x="0" y="0" width="1200" height="155" rx="0" fill="#07111B"/><rect x="5" y="5" width="1190" height="145" rx="9" fill="url(#panel)" stroke="#ffd66c" stroke-width="2"/><rect x="12" y="11" width="1176" height="133" rx="0" fill="url(#grid)"/><rect x="7" y="7" width="5" height="141" rx="0" fill="#ffd66c"/><rect x="13" y="7" width="1174" height="3" rx="0" fill="#ffd66c"/><rect x="18" y="15" width="1164" height="125" rx="10" fill="none" stroke="#ffe59b" stroke-width="3"/><rect x="23" y="21" width="1154" height="113" rx="6" fill="none" stroke="#bd733d" stroke-width="2"/><g class="glow"><rect x="10" y="10" width="1180" height="135" rx="8" fill="none" stroke="#ffe276" opacity=".48" stroke-width="9" filter="url(#glowFilter)"/></g><text x="54" y="48" font-size="18" font-weight="900" fill="#ffd66c" class="mono" letter-spacing="2">YOUR SHORTCUT //</text><text x="53" y="103" font-size="59" font-weight="950" fill="#ffd66c" letter-spacing="-1.8">OPEN MY PORTFOLIO</text><text x="55" y="129" font-size="16" font-weight="850" fill="#8de4e0" class="mono">PROJECTS / DESIGN / EXPERIMENTS / AND MORE</text><g transform="translate(888 16)"><path d="M0 120L70 76 145 119 227 77 274 128Z" fill="#166364"/><path d="M11 118L71 86 142 122" fill="#3ab59c"/><path d="M103 114V36l37-25 40 25v78Z" fill="#105674" stroke="#ffe5a2" stroke-width="7"/><path d="M114 113V41l26-17 27 18v71Z" fill="#173d80"/><path d="M134 113V42" stroke="#7ed8f2" stroke-width="3" opacity=".45"/><path d="M118 117l21-39 24 39" fill="#6fb3eb"/><g fill="#e9f7ca"><circle cx="126" cy="46" r="2"/><circle cx="156" cy="54" r="3"/><circle cx="143" cy="70" r="2"/></g></g><circle cx="1132" cy="82" r="29" fill="#173039" stroke="#ffd772" stroke-width="4"/><path d="M1118 83h27m-12-12l12 12-12 12" fill="none" stroke="#ffd772" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
 </svg>