 <rect x="80" y="55" width="170" height="136" rx="17" fill="url(#blue)" stroke="#d4edff" stroke-width="8"/><path d="M112 54l25-30h57l22 30" fill="#8fbff7" stroke="#d4edff" stroke-width="6"/>
 <circle cx="169" cy="123" r="61" fill="#172e54" stroke="#b4e9ff" stroke-width="8"/><circle cx="169" cy="123" r="42" fill="#154a76" stroke="#5de4f4" stroke-width="6"/><circle cx="169" cy="123" r="22" fill="#112642"/><circle cx="157" cy="108" r="12" fill="#65cdeb" opacity=".7"/><rect x="225" y="76" width="15" height="17" fill="#ffdd93"/>
 <g transform="translate(234 107) rotate(8)"><rect width="47" height="109" fill="#d8f1ff" rx="4"/><rect x="6" y="10" width="35" height="26" fill="#789dda"/><rect x="6" y="43" width="35" height="26" fill="#4e76bd"/><rect x="6" y="76" width="35" height="26" fill="#8bbce8"/></g></g></g><path d="M532 215l26-25m-20 0h20v20" stroke="#94d4d7" stroke-width="4" fill="none"/><g class="spark" fill="#73b7ff"><rect x="516" y="40" width="6" height="6"/><rect x="490" y="72" width="4" height="4"/></g>
 </svg>